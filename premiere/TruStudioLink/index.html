<!doctype html>
<html><head><meta charset="utf-8"><title>Tru Studio Link</title>
<style>
  html,body{margin:0;height:100%;background:#232323;color:#d6d6d6;font:12px -apple-system,"Segoe UI",sans-serif;overflow:hidden}
  .wrap{padding:12px;display:flex;flex-direction:column;gap:10px;height:100%;box-sizing:border-box}
  .row{display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#777;flex:none}
  .dot.on{background:#41c48a} .dot.wait{background:#e0a43a}
  b{color:#fff;font-weight:600}
  .sub{color:#999;font-size:11px;line-height:1.4}
  #log{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px;border-top:1px solid #333;padding-top:8px}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bbb}
  #log .err{color:#ff8a8a} #log .ok{color:#9be2bd}
  label{display:flex;align-items:center;gap:6px;color:#bbb}
</style></head>
<body><div class="wrap">
  <div class="row"><i class="dot" id="dot"></i><b id="st">Looking for Caption Remover…</b></div>
  <div class="sub" id="seq">—</div>
  <label title="New mixes from the studio go onto the active sequence at the playhead"><input type="checkbox" id="ins" checked> Put new mixes on the timeline at the playhead</label>
  <div id="log"></div>
</div>
<script src="main.js"></script>
</body></html>
